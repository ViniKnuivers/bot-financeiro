# Desenvolvimento:  docker compose up -d db        (só o Postgres; a app roda com `npm run dev`)
# Tudo em Docker:   docker compose --profile app up -d --build
# Com WhatsApp:     docker compose --profile app --profile whatsapp up -d --build

# Nome fixo do projeto: sem ele, o Docker usa o nome da pasta, e baixar/renomear a pasta
# (ex.: "bot-financeiro-main" do ZIP do GitHub) criaria um banco novo e vazio.
name: financeiro

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: financeiro
      POSTGRES_PASSWORD: financeiro
      POSTGRES_DB: financeiro
      TZ: America/Sao_Paulo
    ports:
      - '127.0.0.1:5432:5432' # só acessível da própria máquina
    volumes:
      # A partir do Postgres 18 a imagem espera o volume em /var/lib/postgresql
      # (e não mais em /var/lib/postgresql/data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U financeiro -d financeiro']
      interval: 5s
      timeout: 3s
      retries: 10

  # Aplica as migrações e termina. A imagem final (runtime) não tem o CLI do Prisma,
  # então usamos o estágio de build, que tem as devDependencies.
  migrate:
    profiles: [app]
    build:
      context: .
      target: build
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://financeiro:financeiro@db:5432/financeiro?schema=public
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: [app]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      GOOGLE_SERVICE_ACCOUNT_FILE: /app/secrets/google-service-account.json
      DATABASE_URL: postgresql://financeiro:financeiro@db:5432/financeiro?schema=public
    ports:
      - '127.0.0.1:3000:3000'
    # Chave do Google para a planilha (opcional). Somente leitura, e nunca dentro da imagem.
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Endereço público para o webhook do WhatsApp (opcional; veja "WhatsApp" no README).
  # O bot continua no seu computador: o ngrok só repassa o que chega no seu domínio fixo,
  # e o bot só aceita avisos assinados pela Meta (X-Hub-Signature-256).
  ngrok:
    profiles: [whatsapp]
    image: ngrok/ngrok:3.39.11-alpine
    restart: unless-stopped
    command: ['http', 'app:3000', '--url', 'https://${NGROK_DOMAIN:-}']
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      - app

volumes:
  pgdata:
